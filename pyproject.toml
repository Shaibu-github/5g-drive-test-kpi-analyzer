[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drivetest"
version = "1.0.0"
description = "End-to-end 5G drive-test KPI analyzer: cleaning, KPI statistics, handover analysis, maps and throughput prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "folium>=0.14",
]

[project.optional-dependencies]
dev = ["pytest", "nbconvert", "ipykernel"]

[tool.setuptools]
packages = ["drivetest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # lets the tests import drivetest without installing it
