# Runs the test suite on every push, on two Python versions.
# The tests build tiny hand-made logs, so they do not download the dataset.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the packages
        run: |
          python -m pip install --upgrade pip
          # the CPU-only build of PyTorch is a much smaller download
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest
